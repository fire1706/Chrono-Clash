; Préréglages d'export Godot (Projet → Exporter). Il faut avoir installé les « modèles d'export » .NET de Godot 4.7.2.
; Le filtre include_filter ajoute les traductions (fichiers .json) à l'export.

[preset.0]

name="Windows"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="translations/*.json"
exclude_filter=""
export_path="../build/windows/ChronoClash.exe"
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/product_name="Chrono Clash"

[preset.1]

name="Serveur dédié (Linux)"
platform="Linux"
runnable=false
dedicated_server=true
custom_features=""
export_filter="all_resources"
include_filter="translations/*.json"
exclude_filter=""
export_path="../build/server/ChronoClash.x86_64"
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/embed_pck=true
binary_format/architecture="x86_64"
